  - "mcp-server"

allowBuilds:
  esbuild: true

# deps-audit (2026-10-25): geçişli bağımlılıkların GHSA yama sürümleri, yalnız >=14 gün
# önce yayımlanmış olanlar. Üst paketler (sdk/vitest) kendi aralıklarında yamasız sürüme
# kilitli kaldığı için override gerekli; üst paket yama sürümüne geçince kaldırılabilir.
overrides:
  proxy-addr: 2.0.8
  hono: 4.13.13
  qs: 6.16.0
  vite: 7.3.7
  postcss: 8.5.29
  nanoid: 3.3.20
  source-map-js: 1.2.2
  fast-uri: 3.1.8
  ip-address: 10.7.3
